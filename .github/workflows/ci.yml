name: CI

# One job per engine, each running check.sh end to end -- types, the 65 unit and
# wiring tests, and the painted page with that engine's golden frames. There is
# deliberately no second definition of the acceptance checklist here: if the two
# disagree, CI proves something other than what a contributor sees.
#
# Nix supplies node, Deno, Playwright and Firefox. There is no setup-node and no
# npm install because the project has no Node dependencies: the modules import
# each other and `node:*` only.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.browsers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Both engines own baselines in tests/golden and they cannot share them:
      # overlapped, the same pose differs between the two in 3.7% (idle) to 32%
      # (chrome) of pixels, so a shared image set would compare nothing.
      fail-fast: false
      matrix:
        browsers: [firefox, chromium]
    env:
      # gcroots.nix and shell.nix both say `import <nixpkgs>`, and a runner has
      # no Nix channel, so NIX_PATH is empty and every nix-build dies with
      # "file 'nixpkgs' was not found in the Nix search path" -- which is exactly
      # how the first two runs of this workflow failed, on both engines, in the
      # bootstrap step. Set as plain environment rather than an action input
      # because it then works identically for nix-build and nix-shell, and does
      # not depend on an input name that cannot be checked offline.
      #
      # The revision is the one Flux Pond's flake.lock pins, so the two projects
      # share a binary cache and a browser instead of drifting.
      NIX_PATH: nixpkgs=github:NixOS/nixpkgs/5e867b1db0f219e0e906574cca1175f421a87834
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit, the way Flux Pond pins it, so a floating tag cannot
      # break the build underneath a green badge.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Bootstrap the browser out-links check.sh looks for
        run: |
          mkdir -p .gc-roots
          nix-build gcroots.nix -A pw --out-link .gc-roots/pw
          nix-build gcroots.nix -A browsers --out-link .gc-roots/browsers
          nix-build gcroots.nix -A node --out-link .gc-roots/node
      # check.sh rather than a hand-rolled invocation: the out-link paths and
      # PLAYWRIGHT_BROWSERS_PATH are already its business, and repeating them
      # lets CI and a local run drift apart. A phase whose toolchain is missing
      # fails the run instead of skipping, so a bootstrap that half-worked
      # cannot report success.
      - name: Type check, unit tests, painted page
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: nix-shell shell.nix --run ./check.sh
